                  "コード内のコメントや docstring で「意図的に対象外」「仕様」と明記されている設計判断を、欠陥として指摘しない。ただし (a) 範囲の記述と実装が食い違う、(b) 範囲外とした事項が実際にその PR の変更で発生している、(c) 範囲の設定自体が要件に反する、のいずれかに該当する場合は指摘してよい",
