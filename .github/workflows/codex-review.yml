                  "no_findings_json_example は全 checklist 項目が適用可能だった場合の形。対象外の項目があるときは、その項目だけ status=not_applicable と理由の note に置き換える (指摘が無くても対象外項目を ok にしない)",
                  "status=finding の項目は未スキップの finding id を必ず finding_ids に入れる",
